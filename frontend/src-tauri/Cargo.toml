[package]
name = "fintrack-ai"
version = "0.1.0"
description = "FinTrack AI — Smart Personal Finance Desktop"
authors = ["FinTrack AI"]
edition = "2021"
resolver = "2"

[lib]
name = "fintrack_ai_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri with NO compression feature (avoids brotli crate conflict on Rust 1.96)
tauri = { version = "2", default-features = false, features = ["wry", "common-controls-v6", "x11", "dbus"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
