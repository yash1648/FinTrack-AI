# ── FinTrack AI — Development Profile ────────────────────────────────────────
# Extends base application.yaml for local dev via Docker Compose
# Uses PostgreSQL (not H2), Flyway for schema management
# =============================================================================

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fintrack}
    driverClassName: ${DB_CLASS:org.postgresql.Driver}
    username: ${DB_USERNAME:fintrack}
    password: ${DB_PASSWORD:fintrack}

  jpa:
    hibernate:
      ddl-auto: none                         # Flyway manages the schema
    show-sql: true
    open-in-view: false

  h2:
    console:
      enabled: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true                      # Prevent accidental clean
    baseline-on-migrate: false                # Don't baseline — run migrations

# ── Logging ──────────────────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.grim.backend: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.flywaydb: DEBUG
